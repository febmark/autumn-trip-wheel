<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>秋假去哪玩 · 幸运大转盘</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
    background: linear-gradient(160deg, #eaf3ff, #fff6ea) center/cover fixed,
                url('bg.svg') center/cover fixed;
    background-blend-mode: normal;
    min-height: 100vh;
    color: #2b3a5a;
    overflow-x: hidden;
  }
  .wrap { width: min(94vw, 520px); margin: 0 auto; padding: 26px 0 44px; position: relative; z-index: 2; }

  header { text-align: center; margin-bottom: 18px; }
  header h1 {
    font-size: clamp(22px, 5.6vw, 32px); margin: 0 0 8px;
    color: #34507e; letter-spacing: 1px; font-weight: 800;
  }
  header p { margin: 0; font-size: clamp(13px, 3.4vw, 15px); color: #6a7c9c; }

  .card {
    background: rgba(255,255,255,0.92);
    border: 1px solid rgba(120,150,200,0.18);
    border-radius: 18px; padding: 18px 20px;
    box-shadow: 0 10px 28px rgba(70,100,160,0.14);
    margin: 16px 0;
    backdrop-filter: blur(2px);
  }
  .card h3 {
    margin: 0 0 12px; font-size: 17px; color: #34507e;
    display: flex; align-items: center; gap: 8px; font-weight: 800;
  }
  .instructions ul { margin: 0; padding-left: 22px; line-height: 1.95; font-size: 14.5px; color: #4a5878; }
  .instructions li { margin: 2px 0; }

  .prizes .row {
    display: flex; align-items: center; gap: 11px;
    padding: 8px 2px; border-bottom: 1px dashed #e7ecf5; font-size: 14px;
  }
  .prizes .row:last-child { border-bottom: none; }
  .swatch { width: 16px; height: 16px; border-radius: 5px; flex: 0 0 auto; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .prizes .name { font-weight: 700; color: #2b3a5a; min-width: 70px; }
  .prizes .sub { color: #8493b0; }

  .stage { position: relative; margin: 6px auto 4px; width: min(90vw, 400px); }
  .pointer {
    position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; z-index: 5;
    border-left: 17px solid transparent; border-right: 17px solid transparent;
    border-top: 30px solid #ff4d4d;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,0.25));
  }
  canvas#wheel {
    width: 100%; height: auto; display: block; border-radius: 50%;
    box-shadow: 0 14px 34px rgba(70,110,190,0.35), 0 0 0 7px #fff;
    background: #fff; cursor: pointer;
  }

  .spin-btn {
    display: block; margin: 18px auto 4px;
    font-size: clamp(17px, 4.4vw, 20px); font-weight: 800; color: #fff; border: none; cursor: pointer;
    padding: 15px 44px; border-radius: 999px; letter-spacing: 1px;
    background: linear-gradient(135deg, #5b8def, #3a6fd8);
    box-shadow: 0 7px 0 #2c54ab, 0 12px 22px rgba(58,111,216,0.4);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .spin-btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 2px 0 #2c54ab, 0 6px 12px rgba(58,111,216,0.35); }
  .spin-btn:disabled { filter: grayscale(0.3) brightness(0.96); cursor: default; opacity: 0.85; }

  .mute {
    position: fixed; top: 14px; right: 14px; z-index: 20;
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.9); font-size: 20px; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  .tip { text-align: center; margin: 14px 0 0; font-size: 13px; color: #8493b0; }

  .overlay {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center;
    background: rgba(20,30,60,0.45); backdrop-filter: blur(2px); padding: 20px;
  }
  .overlay.show { display: flex; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .card-win {
    background: #fff; border-radius: 28px; padding: 30px 26px 26px;
    max-width: 360px; width: 100%; text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    animation: pop .45s cubic-bezier(.18,.89,.32,1.28);
  }
  @keyframes pop { from { transform: scale(.6) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
  .card-win .emoji { font-size: 62px; line-height: 1; animation: bounce 1s ease infinite; }
  @keyframes bounce { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-10px);} }
  .card-win h2 { margin: 12px 0 4px; font-size: 25px; color: #ff5fa2; }
  .card-win .prize {
    display: inline-block; margin: 10px 0 6px; padding: 10px 22px;
    background: linear-gradient(135deg,#ffe27a,#ffc83d); border-radius: 14px;
    font-size: 22px; font-weight: 800; color: #9a5b00; box-shadow: inset 0 2px 4px rgba(255,255,255,0.7);
  }
  .card-win .desc { font-size: 15px; color: #566; line-height: 1.6; margin: 6px 4px 18px; }
  .card-win .btn-row { display: flex; gap: 12px; justify-content: center; }
  .card-win button { flex: 1; border: none; cursor: pointer; font-weight: 800; font-size: 16px; padding: 13px 0; border-radius: 14px; }
  .btn-yes { background: linear-gradient(135deg,#7ee8a0,#36c46b); color: #fff; box-shadow: 0 5px 0 #259a50; }
  .btn-again { background: #eef2fb; color: #4a5b8c; }
  .card-win button:active { transform: translateY(3px); box-shadow: none; }

  #confetti { position: fixed; inset: 0; z-index: 25; pointer-events: none; display: none; }
</style>
</head>
<body>
  <button class="mute" id="muteBtn" title="开关声音">🔊</button>

  <div class="wrap">
    <header>
      <h1>秋假去哪玩 · 幸运大转盘</h1>
      <p>转一转，看看这个假期我们去哪儿冒险 🎡</p>
    </header>

    <section class="card instructions">
      <h3>📋 游戏说明</h3>
      <ul>
        <li>点击「开始转盘」按钮，转盘开始旋转。</li>
        <li>转盘停下时，顶部指针所指的目的地即为本次结果。</li>
        <li>想再玩一次，刷新网页即可重新抽奖。</li>
        <li>愿小朋友旅途愉快，玩得开心！</li>
      </ul>
    </section>

    <div class="stage">
      <div class="pointer"></div>
      <canvas id="wheel" width="480" height="480"></canvas>
    </div>
    <button class="spin-btn" id="spinBtn">开始转盘</button>

    <section class="card prizes">
      <h3>🎁 奖项一览</h3>
      <div id="prizeList"></div>
    </section>

    <div class="tip">小提示：刷新网页可以重新抽奖～</div>
  </div>

  <canvas id="confetti"></canvas>

  <div class="overlay" id="overlay">
    <div class="card-win">
      <div class="emoji">🎉</div>
      <h2>恭喜你抽中啦！</h2>
      <div class="prize" id="prizeName">上海</div>
      <div class="desc" id="prizeDesc">上海迪士尼乐园 + 海昌海洋公园，<br>准备好和爸爸妈妈一起出发了吗？🏰🌊</div>
      <div class="btn-row">
        <button class="btn-again" id="againBtn">再转一次</button>
        <button class="btn-yes" id="yesBtn">太棒了！</button>
      </div>
    </div>
  </div>

<script>
(function () {
  const segments = [
    { label: "上海", sub: "迪士尼 + 海昌", color: "#FFC93C", special: true },
    { label: "北京", sub: "环球影城",     color: "#FF6B6B" },
    { label: "广州", sub: "长隆欢乐",     color: "#4ECDC4" },
    { label: "成都", sub: "大熊猫基地",   color: "#FF9F1C" },
    { label: "三亚", sub: "海滩度假",     color: "#1B9AAA" },
    { label: "杭州", sub: "西湖乐园",     color: "#A06CD5" },
    { label: "西安", sub: "兵马俑探险",   color: "#F15BB5" },
    { label: "深圳", sub: "欢乐谷",       color: "#06D6A0" }
  ];
  const N = segments.length;
  const SEG = (Math.PI * 2) / N;
  const WIN_INDEX = 0; // 上海永远必中

  // 渲染奖项一览
  const prizeList = document.getElementById("prizeList");
  segments.forEach((s) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<span class="swatch" style="background:' + s.color + '"></span>' +
      '<span class="name">' + (s.special ? "⭐ " : "") + s.label + '</span>' +
      '<span class="sub">' + s.sub + '</span>';
    prizeList.appendChild(row);
  });

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const size = canvas.width;
  const cx = size / 2, cy = size / 2, radius = size / 2 - 6;

  let currentRotation = Math.random() * Math.PI * 2;
  let spinning = false, muted = false, lastTickIndex = -1;

  // ---------- 声音 ----------
  let ac = null;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }
  function tick() {
    if (muted) return;
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = "square"; o.frequency.value = 720;
    g.gain.setValueAtTime(0.04, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.05);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + 0.05);
  }
  function fanfare() {
    if (muted) return;
    const a = audio(); if (!a) return;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = "triangle"; o.frequency.value = f;
      const t = a.currentTime + i * 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.4);
    });
  }

  // ---------- 绘制 ----------
  function drawWheel(rotation) {
    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);
    for (let i = 0; i < N; i++) {
      const a0 = -Math.PI / 2 + i * SEG - SEG / 2;
      const a1 = -Math.PI / 2 + i * SEG + SEG / 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius, a0, a1);
      ctx.closePath();
      ctx.fillStyle = segments[i].color;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();
      ctx.save();
      ctx.rotate(-Math.PI / 2 + i * SEG);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 22px 'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.shadowColor = "rgba(0,0,0,0.25)";
      ctx.shadowBlur = 3;
      ctx.fillText((segments[i].special ? "⭐" : "") + segments[i].label, radius - 18, -8);
      ctx.shadowBlur = 0;
      ctx.font = "13px 'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.fillStyle = "rgba(255,255,255,0.92)";
      ctx.fillText(segments[i].sub, radius - 18, 12);
      ctx.restore();
    }
    ctx.restore();
    drawBullseye();
  }

  // 中心点（靶心）直接画在画布真实中心，保证居中
  function drawBullseye() {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.beginPath(); ctx.arc(0, 0, 38, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "rgba(40,60,110,0.35)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    [[30, "#ff5a5a"], [23, "#ffffff"], [15, "#ff5a5a"], [7, "#ffffff"]].forEach(([r, c]) => {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill();
    });
    ctx.restore();
  }

  function getWinnerIndex(rotation) {
    const rel = (((-rotation) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    return Math.round(rel / SEG) % N;
  }

  // ---------- 旋转 ----------
  function spin() {
    if (spinning) return;
    spinning = true;
    audio();
    document.getElementById("spinBtn").disabled = true;

    const fullTurns = 5 + Math.floor(Math.random() * 4);
    const jitter = (Math.random() - 0.5) * SEG * 0.7;
    const targetMod = ((jitter % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const currentMod = ((currentRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    let delta = ((targetMod - currentMod) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    const total = delta + Math.PI * 2 * fullTurns;
    const startRot = currentRotation;
    const endRot = startRot + total;
    const duration = 4200 + Math.random() * 800;
    const startTime = performance.now();
    lastTickIndex = getWinnerIndex(startRot);

    function frame(now) {
      let t = (now - startTime) / duration;
      if (t > 1) t = 1;
      const eased = 1 - Math.pow(1 - t, 3);
      const rot = startRot + (endRot - startRot) * eased;
      drawWheel(rot);
      const w = getWinnerIndex(rot);
      if (w !== lastTickIndex) { tick(); lastTickIndex = w; }
      if (t < 1) requestAnimationFrame(frame);
      else {
        currentRotation = endRot;
        spinning = false;
        document.getElementById("spinBtn").disabled = false;
        onWin();
      }
    }
    requestAnimationFrame(frame);
  }

  function onWin() {
    document.getElementById("prizeName").textContent = segments[WIN_INDEX].label;
    fanfare();
    launchConfetti();
    setTimeout(() => document.getElementById("overlay").classList.add("show"), 350);
  }

  // 点击转盘中心的靶心也能转
  canvas.addEventListener("click", (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width * size;
    const y = (e.clientY - rect.top) / rect.height * size;
    if (Math.hypot(x - cx, y - cy) <= 42) spin();
  });

  // ---------- 彩带 ----------
  const cf = document.getElementById("confetti");
  const cfx = cf.getContext("2d");
  let particles = [], cfRAF = null;
  function resizeCf() { cf.width = window.innerWidth; cf.height = window.innerHeight; }
  resizeCf();
  window.addEventListener("resize", resizeCf);
  function launchConfetti() {
    cf.style.display = "block";
    const colors = ["#FF6B6B", "#4ECDC4", "#FFC93C", "#A06CD5", "#06D6A0", "#FF9F1C", "#F15BB5"];
    particles = [];
    for (let i = 0; i < 160; i++) {
      particles.push({
        x: cf.width / 2 + (Math.random() - 0.5) * 200, y: cf.height / 3,
        vx: (Math.random() - 0.5) * 12, vy: Math.random() * -14 - 4,
        g: 0.32 + Math.random() * 0.2, size: 6 + Math.random() * 8,
        color: colors[(Math.random() * colors.length) | 0],
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4
      });
    }
    if (cfRAF) cancelAnimationFrame(cfRAF);
    animateConfetti();
  }
  function animateConfetti() {
    cfx.clearRect(0, 0, cf.width, cf.height);
    let alive = false;
    for (const p of particles) {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y < cf.height + 30) alive = true;
      cfx.save();
      cfx.translate(p.x, p.y); cfx.rotate(p.rot);
      cfx.fillStyle = p.color;
      cfx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      cfx.restore();
    }
    if (alive) cfRAF = requestAnimationFrame(animateConfetti);
    else { cf.style.display = "none"; cfx.clearRect(0, 0, cf.width, cf.height); }
  }

  // ---------- 事件 ----------
  document.getElementById("spinBtn").addEventListener("click", spin);
  document.getElementById("againBtn").addEventListener("click", () => {
    document.getElementById("overlay").classList.remove("show");
    setTimeout(spin, 250);
  });
  document.getElementById("yesBtn").addEventListener("click", () => {
    document.getElementById("overlay").classList.remove("show");
  });
  document.getElementById("muteBtn").addEventListener("click", (e) => {
    muted = !muted;
    e.target.textContent = muted ? "🔇" : "🔊";
  });

  drawWheel(currentRotation);
})();
</script>
</body>
</html>
